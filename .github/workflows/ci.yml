name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Scripts/dmg-requirements.txt

      - name: Check scripts and version
        run: |
          for script in Scripts/*.sh; do
            if [[ "$script" == Scripts/generate-assets.sh ]]; then
              zsh -n "$script"
            else
              bash -n "$script"
            fi
          done
          bash Scripts/version.sh
          xcodebuild -version
          swift --version

      - name: Test
        run: bash Scripts/ci-annotate.sh Test bash Scripts/test.sh

      - name: Build and verify universal DMG
        run: bash Scripts/ci-annotate.sh "Build DMG" bash Scripts/build-dmg.sh

      - name: Upload installer
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MacClean-${{ github.sha }}
          path: |
            dist/MacClean.dmg
            dist/MacClean.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
