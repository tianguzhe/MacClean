name: Release DMG

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag matches app version
        run: bash Scripts/version.sh --check-tag "$GITHUB_REF_NAME"

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Scripts/dmg-requirements.txt

      - name: Test
        run: bash Scripts/ci-annotate.sh Test bash Scripts/test.sh

      - name: Build and verify universal DMG
        run: bash Scripts/ci-annotate.sh "Build DMG" bash Scripts/build-dmg.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/MacClean.dmg dist/MacClean.dmg.sha256 \
            --verify-tag --title "MacClean $GITHUB_REF_NAME" --generate-notes

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
